name: Deploy to Cloudflare

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: cloudflare-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build

      - name: Prepare CI wrangler config
        run: |
          awk '!/^route *=/' wrangler.toml > wrangler.ci.toml

      - name: Verify Cloudflare auth
        run: |
          export CLOUDFLARE_API_TOKEN="${{ secrets.CLOUDFLARE_API_TOKEN }}"
          export CF_API_TOKEN="$CLOUDFLARE_API_TOKEN"
          npx wrangler@3 whoami

      - name: Deploy with Wrangler CLI
        run: |
          export CLOUDFLARE_API_TOKEN="${{ secrets.CLOUDFLARE_API_TOKEN }}"
          export CF_API_TOKEN="$CLOUDFLARE_API_TOKEN"
          if ! npx wrangler@3 deploy --config wrangler.ci.toml > wrangler-deploy.log 2>&1; then
            msg="$(tail -n 60 wrangler-deploy.log | tr '\n' '|' | sed 's/%/%25/g;s/\r/%0D/g;s/\n/%0A/g')"
            echo "::error title=Wrangler deploy failed::$msg"
            cat wrangler-deploy.log
            exit 1
          fi
          cat wrangler-deploy.log
